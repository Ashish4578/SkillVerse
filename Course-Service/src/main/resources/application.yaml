server:
  port: 8084
spring:
  application:
    name: COURSE-SERVICE
  config:
    import: optional:configserver:http://localhost:8085
  datasource:
    url: jdbc:mysql://localhost:3306/skillverse_course_data
    username: root
    password: Sql#1541
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    web:
      pageable:
        max-page-size: 50
        default-page-size: 10
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  # Kafka config
  kafka:
    bootstrap-servers: localhost:9092
management:
  endpoints:
    web:
      exposure:
        include: "*"
minio:
  url: http://localhost:9000
  access-key: admin
  secret-key: admin123
  bucket-name: skillverse

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
